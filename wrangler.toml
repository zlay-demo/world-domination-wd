name = "world-domination-wd"
main = "src/index.js"
compatibility_date = "2026-11-23"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "world-domination-wd"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
BOT_USERNAME = "REPLACE_WITH_BOT_USERNAME"
